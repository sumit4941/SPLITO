name: Oracle integration

on:
  pull_request:
    paths:
      - 'database/**'
      - 'apps/api/**'
      - 'apps/worker/**'
      - 'packages/config/**'
      - 'packages/domain/**'
      - 'package*.json'
      - '.github/workflows/oracle-integration.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracle:
    name: Migrate and test on Oracle
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      oracle:
        # Oracle AI Database 26ai Free 23.26.3 slim-faststart, pinned to its
        # linux/amd64 manifest so upstream tag movement cannot change CI.
        image: gvenzl/oracle-free:23.26.3-slim-faststart@sha256:d86d09794ae138a8951e97d7ee010778dcd43088e8d0f83a51002abab8c6d7fd
        env:
          # Test-only constants for an ephemeral CI database. gitleaks:allow
          ORACLE_PASSWORD: ci-only-oracle-admin-1A # gitleaks:allow
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Use Node.js LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Create least-privilege users
        env:
          SPLITO_ADMIN_DB_CONNECT_STRING: localhost:1521/FREEPDB1
          SPLITO_ADMIN_DB_USER: SYSTEM
          SPLITO_ADMIN_DB_PASSWORD: ci-only-oracle-admin-1A # gitleaks:allow
          SPLITO_MIGRATION_DB_USER: SPLITO_OWNER
          SPLITO_MIGRATION_DB_PASSWORD: ci-only-splito-owner-1A # gitleaks:allow
          SPLITO_DB_USER: SPLITO_APP
          SPLITO_DB_PASSWORD: ci-only-splito-runtime-1A # gitleaks:allow
        run: node database/admin/bootstrap-users.mjs
      - name: Apply migrations
        env:
          SPLITO_MIGRATION_DB_CONNECT_STRING: localhost:1521/FREEPDB1
          SPLITO_MIGRATION_DB_USER: SPLITO_OWNER
          SPLITO_MIGRATION_DB_PASSWORD: ci-only-splito-owner-1A # gitleaks:allow
        run: node database/scripts/migrate.mjs
      - name: Prove migration rerun is idempotent
        env:
          SPLITO_MIGRATION_DB_CONNECT_STRING: localhost:1521/FREEPDB1
          SPLITO_MIGRATION_DB_USER: SPLITO_OWNER
          SPLITO_MIGRATION_DB_PASSWORD: ci-only-splito-owner-1A # gitleaks:allow
        run: node database/scripts/migrate.mjs
      - name: Validate owner schema and prefix
        env:
          SPLITO_MIGRATION_DB_CONNECT_STRING: localhost:1521/FREEPDB1
          SPLITO_MIGRATION_DB_USER: SPLITO_OWNER
          SPLITO_MIGRATION_DB_PASSWORD: ci-only-splito-owner-1A # gitleaks:allow
        run: |
          node database/scripts/check-prefix.mjs
          node database/scripts/validate-schema.mjs
      - name: Verify least-privilege runtime connection
        env:
          DATABASE_CONNECT_STRING: localhost:1521/FREEPDB1
          DATABASE_USER: SPLITO_APP
          DATABASE_OWNER_SCHEMA: SPLITO_OWNER
          DATABASE_PASSWORD: ci-only-splito-runtime-1A # gitleaks:allow
        run: |
          node database/scripts/verify-connection.mjs
      - name: Seed synthetic financial data
        env:
          NODE_ENV: development
          SPLITO_ALLOW_DEVELOPMENT_SEED: 'true'
          SPLITO_MIGRATION_DB_CONNECT_STRING: localhost:1521/FREEPDB1
          SPLITO_MIGRATION_DB_USER: SPLITO_OWNER
          SPLITO_MIGRATION_DB_PASSWORD: ci-only-splito-owner-1A # gitleaks:allow
        run: node database/seed/development.mjs
      - name: Reconcile synthetic financial data
        env:
          DATABASE_CONNECT_STRING: localhost:1521/FREEPDB1
          DATABASE_USER: SPLITO_APP
          DATABASE_OWNER_SCHEMA: SPLITO_OWNER
          DATABASE_PASSWORD: ci-only-splito-runtime-1A # gitleaks:allow
        run: node database/scripts/reconcile.mjs
      - name: Run Oracle integration suites
        env:
          NODE_ENV: test
          DATABASE_CONNECT_STRING: localhost:1521/FREEPDB1
          DATABASE_USER: SPLITO_APP
          DATABASE_OWNER_SCHEMA: SPLITO_OWNER
          DATABASE_PASSWORD: ci-only-splito-runtime-1A # gitleaks:allow
          SPLITO_MIGRATION_DB_CONNECT_STRING: localhost:1521/FREEPDB1
          SPLITO_MIGRATION_DB_USER: SPLITO_OWNER
          SPLITO_MIGRATION_DB_PASSWORD: ci-only-splito-owner-1A # gitleaks:allow
        run: npm run test:integration --workspaces --if-present
