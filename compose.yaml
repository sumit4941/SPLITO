name: splito

services:
  mongo:
    profiles: ['local-db']
    image: mongo:8.0.30-noble
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    restart: unless-stopped
    ports:
      # The replica-set member advertises localhost:27017 to host-run apps, so
      # keep this development-only mapping fixed to that address and port.
      - '127.0.0.1:27017:27017'
    volumes:
      - splito-mongodb-data:/data/db
    healthcheck:
      test: ['CMD-SHELL', 'mongosh --quiet --eval "if (!db.adminCommand({ ping: 1 }).ok) quit(1)"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  mongo-init:
    profiles: ['local-db']
    image: mongo:8.0.30-noble
    depends_on:
      mongo:
        condition: service_healthy
    command:
      [
        'mongosh',
        'mongodb://mongo:27017/admin',
        '--quiet',
        '--eval',
        "try { rs.status() } catch (error) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) }; for (let attempt = 0; attempt < 60; attempt += 1) { if (db.hello().isWritablePrimary) quit(0); sleep(500) }; quit(1)",
      ]
    restart: 'no'
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_HOST: 0.0.0.0
      API_PORT: 3000
      WEB_ORIGIN: ${SPLITO_WEB_ORIGIN:?Set SPLITO_WEB_ORIGIN to the exact web origin}
      TRUST_PROXY: 'true'
      COOKIE_SECURE: '${COOKIE_SECURE:-true}'
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI to the external MongoDB replica set}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-splito}
      MONGODB_MIN_POOL_SIZE: ${MONGODB_MIN_POOL_SIZE:-1}
      MONGODB_MAX_POOL_SIZE: ${MONGODB_MAX_POOL_SIZE:-10}
      MONGODB_CONNECT_TIMEOUT_MS: ${MONGODB_CONNECT_TIMEOUT_MS:-10000}
      MONGODB_SERVER_SELECTION_TIMEOUT_MS: ${MONGODB_SERVER_SELECTION_TIMEOUT_MS:-10000}
      MONGODB_SOCKET_TIMEOUT_MS: ${MONGODB_SOCKET_TIMEOUT_MS:-30000}
      SESSION_PEPPER: ${SESSION_PEPPER:?Set SESSION_PEPPER}
      CSRF_SECRET: ${CSRF_SECRET:?Set CSRF_SECRET}
      OTP_PEPPER: ${OTP_PEPPER:?Set OTP_PEPPER}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Set MFA_ENCRYPTION_KEY}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-60}
      SESSION_ABSOLUTE_HOURS: ${SESSION_ABSOLUTE_HOURS:-720}
      ATTACHMENT_STORAGE_PATH: /var/lib/splito/private
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10000000}
      SMS_PROVIDER: ${SMS_PROVIDER:?Set SMS_PROVIDER to twilio after configuring spend and region controls}
      SMS_REQUEST_TIMEOUT_MS: ${SMS_REQUEST_TIMEOUT_MS:-8000}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:?Set TWILIO_ACCOUNT_SID}
      TWILIO_API_KEY_SID: ${TWILIO_API_KEY_SID:?Set TWILIO_API_KEY_SID}
      TWILIO_API_KEY_SECRET: ${TWILIO_API_KEY_SECRET:?Set TWILIO_API_KEY_SECRET}
      TWILIO_FROM_E164: ${TWILIO_FROM_E164:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
    ports:
      - '127.0.0.1:${SPLITO_API_PUBLIC_PORT:-3000}:3000'
    volumes:
      - splito-private-storage:/var/lib/splito/private
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

  worker:
    profiles: ['worker']
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.worker
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI to the external MongoDB replica set}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-splito}
      MONGODB_MIN_POOL_SIZE: ${MONGODB_MIN_POOL_SIZE:-1}
      MONGODB_MAX_POOL_SIZE: ${MONGODB_MAX_POOL_SIZE:-10}
      MONGODB_CONNECT_TIMEOUT_MS: ${MONGODB_CONNECT_TIMEOUT_MS:-10000}
      MONGODB_SERVER_SELECTION_TIMEOUT_MS: ${MONGODB_SERVER_SELECTION_TIMEOUT_MS:-10000}
      MONGODB_SOCKET_TIMEOUT_MS: ${MONGODB_SOCKET_TIMEOUT_MS:-30000}
      OUTBOX_POLL_MS: ${OUTBOX_POLL_MS:-1000}
      OUTBOX_LEASE_SECONDS: ${OUTBOX_LEASE_SECONDS:-60}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-10}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:${SPLITO_WEB_PUBLIC_PORT:-8080}:8080'
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=32m,mode=0755
    security_opt:
      - no-new-privileges:true

  migrate:
    profiles: ['tools']
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.api
    environment:
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI to the external MongoDB replica set}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-splito}
      MONGODB_MIN_POOL_SIZE: ${MONGODB_MIN_POOL_SIZE:-1}
      MONGODB_MAX_POOL_SIZE: ${MONGODB_MAX_POOL_SIZE:-10}
      MONGODB_CONNECT_TIMEOUT_MS: ${MONGODB_CONNECT_TIMEOUT_MS:-10000}
      MONGODB_SERVER_SELECTION_TIMEOUT_MS: ${MONGODB_SERVER_SELECTION_TIMEOUT_MS:-10000}
      MONGODB_SOCKET_TIMEOUT_MS: ${MONGODB_SOCKET_TIMEOUT_MS:-30000}
    command: ['node', 'database/scripts/migrate.mjs']
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true

volumes:
  splito-mongodb-data:
  splito-private-storage:
